<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow IA - Análise de Documentos</title>
    <style>
        /* ESTÉTICA LIQUID GLASS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        .main-layout { display: flex; gap: 20px; width: 100%; max-width: 1100px; justify-content: center; align-items: flex-start; }

        .smart-container { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.9); 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.08); 
            width: 100%; 
            max-width: 740px; 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        /* Painel Lateral de Caixas / Histórico */
        .sidebar-boxes {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.08);
            width: 320px;
            max-height: 600px;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar-title { font-size: 13px; font-weight: 700; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .doc-box { background: white; border: 1px solid #dcdde1; padding: 14px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .doc-box:hover { transform: translateY(-2px); border-color: #3498db; }
        .doc-box-title { font-size: 14px; font-weight: 600; color: #2c3e50; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .doc-box-snippet { font-size: 12px; color: #7f8c8d; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Tela de Autenticação */
        .auth-screen { padding: 40px 30px; display: flex; flex-direction: column; gap: 20px; text-align: center; }
        .auth-title { font-size: 22px; font-weight: 700; color: #2c3e50; }
        .auth-subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
        .auth-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #dcdde1; background: white; font-size: 15px; outline: none; transition: 0.3s; }
        .auth-input:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        
        .btn-primary { width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: #000; }
        
        .btn-google { width: 100%; padding: 12px; background: white; color: #2c3e50; border: 1px solid #dcdde1; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f1f2f6; }
        
        .auth-switch { font-size: 13px; color: #7f8c8d; cursor: pointer; margin-top: 10px; }
        .auth-switch span { color: #3498db; font-weight: 600; }

        /* Área de App */
        .app-screen { display: none; flex-direction: column; }
        .user-header { padding: 16px 24px; background: rgba(255, 255, 255, 0.4); border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #596a7b; }
        .btn-logout { background: transparent; border: none; color: #e74c3c; font-weight: 600; cursor: pointer; }

        /* Barra Dividida em Dois */
        .prompt-area { 
            padding: 20px 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.3); 
            gap: 15px;
        }
        
        .prompt-left { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .prompt-right { flex: 1; display: flex; align-items: center; gap: 10px; border-left: 1px solid rgba(0,0,0,0.1); padding-left: 15px; }

        .file-name { font-size: 15px; color: #2c3e50; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .search-input { width: 100%; background: transparent; border: none; outline: none; font-size: 15px; color: #2c3e50; }
        .search-input::placeholder { color: #7f8c8d; }

        .btn-submit { background: #2c3e50; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .btn-submit:hover:not(:disabled) { transform: scale(1.1); background: #000; }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        .results-area { max-height: 0; opacity: 0; transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); background: rgba(255, 255, 255, 0.85); border-top: 1px solid rgba(0,0,0,0.05); overflow: hidden; display: flex; }
        .expanded .results-area { max-height: 1200px; opacity: 1; padding: 32px 24px; }

        .result-content-wrapper { flex: 1; min-width: 0; }
        .result-block { margin-bottom: 0; }
        .result-title { font-size: 12px; font-weight: 700; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        
        .script-box { background: white; border: 1px solid #dcdde1; padding: 16px; border-radius: 12px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        
        .share-sidebar { display: flex; flex-direction: column; gap: 10px; margin-left: 16px; justify-content: flex-start; align-items: center; padding-top: 24px; }
        .share-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; position: relative; text-decoration: none; color: #2c3e50; }
        .share-btn:hover { transform: scale(1.1); background: #f1f2f6; }
        .share-btn svg { width: 18px; height: 18px; }
        
        .share-btn.whatsapp:hover { background: #25d366; color: white; }
        .share-btn.email:hover { background: #ea4335; color: white; }
        .share-btn.copy:hover { background: #3498db; color: white; }
        .share-btn.download:hover { background: #2c3e50; color: white; }

        .spinner { width: 16px; height: 16px; border: 2px solid #3498db; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body tabindex="0">

    <div class="main-layout">
        <!-- Container Principal -->
        <div class="smart-container" id="mainContainer">
            
            <!-- TELA DE LOGIN / CADASTRO -->
            <div id="authScreen" class="auth-screen">
                <h1 class="auth-title" id="authTitle">Bem-vindo ao DocFlow IA</h1>
                <p class="auth-subtitle" id="authSubtitle">Faça login para continuar</p>
                
                <input type="email" id="emailInput" class="auth-input" placeholder="Seu e-mail">
                <input type="password" id="passwordInput" class="auth-input" placeholder="Sua senha">
                
                <button id="authBtn" class="btn-primary" onclick="handleAuth()">Entrar</button>
                <button class="btn-google" onclick="loginGoogle()">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.31 7.24 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.99 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.69 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    Continuar com Google
                </button>
                
                <div class="auth-switch" onclick="toggleAuthMode()">
                    Não tem uma conta? <span id="switchText">Cadastre-se</span>
                </div>
                <div id="authError" style="color: #e74c3c; font-size: 13px;"></div>
            </div>

            <!-- TELA DO APLICATIVO -->
            <div id="appScreen" class="app-screen">
                <div class="user-header">
                    <span id="userEmailDisplay">Logado como: ...</span>
                    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
                </div>

                <!-- Barra Dividida em Dois (Esquerda: Anexo | Direita: Busca por Nome/CPF/CNPJ) -->
                <div class="prompt-area">
                    <!-- Lado Esquerdo: Anexar Documento -->
                    <div class="prompt-left" onclick="document.getElementById('arquivoPdf').click()" title="Clique para anexar arquivo">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2c3e50" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                        </svg>
                        <span id="fileName" class="file-name" style="color: #7f8c8d;">Anexar documento...</span>
                        <input type="file" id="arquivoPdf" accept=".pdf,.doc,.docx,.txt,.png,.jpg" style="display: none;" onchange="atualizarNomeArquivo()" />
                    </div>

                    <!-- Lado Direito: Buscar nos Resumos (Nome, CPF ou CNPJ) -->
                    <div class="prompt-right">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7f8c8d" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nome, CPF ou CNPJ..." oninput="filtrarCaixas(this.value)" />
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="status-text" id="statusText">
                            <div class="spinner"></div>
                        </div>
                        <button id="btnSubmit" class="btn-submit" disabled onclick="processarDocumento()">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="results-area">
                    <div class="result-content-wrapper">
                        <div class="result-block">
                            <div class="result-title" id="resultadoTitulo">⚡ Relatório da Análise</div>
                            <div class="script-box">
                                <div id="iaResultado" style="white-space: pre-wrap; color: #2c3e50; font-size: 15px; line-height: 1.5;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Ícones de Compartilhamento Vertical (Bolinhas) -->
                    <div class="share-sidebar">
                        <button class="share-btn whatsapp" onclick="compartilharWhatsApp()" title="Compartilhar no WhatsApp">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                        </button>
                        <button class="share-btn email" onclick="compartilharEmail()" title="Enviar por E-mail">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </button>
                        <button class="share-btn copy" onclick="copiarTexto()" title="Copiar Resultado">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                        <button class="share-btn download" onclick="baixarTxt()" title="Baixar como TXT">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Painel Lateral de Caixas (Resumos Salvos no Firebase) -->
        <div class="sidebar-boxes" id="sidebarBoxes">
            <div class="sidebar-title">📁 Caixas de Resumos</div>
            <div id="listaCaixas">
                <p style="font-size: 13px; color: #7f8c8d; text-align: center; margin-top: 20px;">Nenhum documento salvo ainda.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3lORq3nF7mbcQc-YZObZvBwMXtVWQ5y4",
            authDomain: "systemhyper1.firebaseapp.com",
            databaseURL: "https://systemhyper1-default-rtdb.firebaseio.com",
            projectId: "systemhyper1",
            storageBucket: "systemhyper1.firebasestorage.app",
            messagingSenderId: "65464629978",
            appId: "1:65464629978:web:2201ea8087f992310403e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let isRegistering = false;
        let documentosSalvos = [];

        window.toggleAuthMode = function() {
            isRegistering = !isRegistering;
            document.getElementById('authTitle').textContent = isRegistering ? "Criar Nova Conta" : "Bem-vindo ao DocFlow IA";
            document.getElementById('authSubtitle').textContent = isRegistering ? "Cadastre-se para começar" : "Faça login para continuar";
            document.getElementById('authBtn').textContent = isRegistering ? "Cadastrar" : "Entrar";
            document.getElementById('switchText').textContent = isRegistering ? "Fazer login" : "Cadastre-se";
        }

        window.handleAuth = async function() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            const errDiv = document.getElementById('authError');
            errDiv.textContent = "";

            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (error) {
                errDiv.textContent = error.message;
            }
        }

        window.loginGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                document.getElementById('authError').textContent = error.message;
            }
        }

        window.fazerLogout = function() {
            signOut(auth);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                document.getElementById('sidebarBoxes').style.display = 'flex';
                document.getElementById('userEmailDisplay').textContent = `Logado como: ${user.email}`;
                carregarCaixasFirebase(user.uid);
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
                document.getElementById('sidebarBoxes').style.display = 'none';
            }
        });

        function carregarCaixasFirebase(uid) {
            const historicoRef = ref(db, `historico_analises/${uid}`);
            onValue(historicoRef, (snapshot) => {
                const data = snapshot.val();
                const listaDiv = document.getElementById('listaCaixas');
                listaDiv.innerHTML = "";
                documentosSalvos = [];

                if (data) {
                    Object.keys(data).forEach(key => {
                        const doc = data[key];
                        documentosSalvos.push(doc);
                        renderizarCaixa(doc, listaDiv);
                    });
                } else {
                    listaDiv.innerHTML = '<p style="font-size: 13px; color: #7f8c8d; text-align: center; margin-top: 20px;">Nenhum documento salvo ainda.</p>';
                }
            });
        }

        function renderizarCaixa(doc, container) {
            const box = document.createElement('div');
            box.className = 'doc-box';
            box.onclick = () => abrirDocumentoCaixa(doc);
            
            box.innerHTML = `
                <div class="doc-box-title">${doc.nome_arquivo}</div>
                <div class="doc-box-snippet">${doc.resultado}</div>
            `;
            container.appendChild(box);
        }

        window.abrirDocumentoCaixa = function(doc) {
            resultadoTitulo.textContent = `⚡ Resultado: ${doc.nome_arquivo}`;
            iaResultado.textContent = doc.resultado;
            mainContainer.classList.add('expanded');
        }

        window.filtrarCaixas = function(termo) {
            const termoLower = termo.toLowerCase();
            const listaDiv = document.getElementById('listaCaixas');
            listaDiv.innerHTML = "";

            const filtrados = documentosSalvos.filter(doc => 
                doc.nome_arquivo.toLowerCase().includes(termoLower) || 
                doc.resultado.toLowerCase().includes(termoLower)
            );

            if (filtrados.length > 0) {
                filtrados.forEach(doc => renderizarCaixa(doc, listaDiv));
            } else {
                listaDiv.innerHTML = '<p style="font-size: 13px; color: #7f8c8d; text-align: center; margin-top: 20px;">Nenhum contrato encontrado.</p>';
            }
        }

        const inputArquivo = document.getElementById('arquivoPdf');
        const fileName = document.getElementById('fileName');
        const btnSubmit = document.getElementById('btnSubmit');
        const mainContainer = document.getElementById('mainContainer');
        const statusText = document.getElementById('statusText');
        const iaResultado = document.getElementById('iaResultado');
        const resultadoTitulo = document.getElementById('resultadoTitulo');

        window.atualizarNomeArquivo = function() {
            if (inputArquivo.files.length > 0) {
                fileName.textContent = inputArquivo.files[0].name;
                fileName.style.color = "#2c3e50";
                btnSubmit.disabled = false;
            } else {
                fileName.textContent = "Anexar documento...";
                fileName.style.color = "#7f8c8d";
                btnSubmit.disabled = true;
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !btnSubmit.disabled && inputArquivo.files.length > 0) {
                processarDocumento();
            }
        });

        window.processarDocumento = async function() {
            if (inputArquivo.files.length === 0) return;

            const file = inputArquivo.files[0];
            const formData = new FormData();
            formData.append('file', file);

            btnSubmit.disabled = true;
            statusText.style.opacity = "1";
            mainContainer.classList.remove('expanded');

            try {
                const response = await fetch('/api/analisar', {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const textError = await response.text();
                    throw new Error(`Erro do Servidor (${response.status}): ${textError.slice(0, 100)}`);
                }

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido ao processar.');
                }

                resultadoTitulo.textContent = `⚡ Resultado: ${file.name}`;
                iaResultado.textContent = data.resultado;
                mainContainer.classList.add('expanded');

                // Enviar e salvar automaticamente a nova caixa no Firebase Realtime Database
                const user = auth.currentUser;
                if (user) {
                    push(ref(db, `historico_analises/${user.uid}`), {
                        nome_arquivo: file.name,
                        resultado: data.resultado,
                        timestamp: serverTimestamp()
                    });
                }

            } catch (error) {
                console.error(error);
                resultadoTitulo.textContent = "⚡ Erro na Análise";
                iaResultado.textContent = `Erro: ${error.message}`;
                mainContainer.classList.add('expanded');
            } finally {
                statusText.style.opacity = "0";
                btnSubmit.disabled = false;
            }
        }

        window.copiarTexto = function() {
            navigator.clipboard.writeText(iaResultado.innerText);
            alert("Resultado copiado para a área de transferência!");
        }

        window.compartilharWhatsApp = function() {
            const texto = encodeURIComponent("Relatório de Análise do Documento:\n\n" + iaResultado.innerText);
            window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
        }

        window.compartilharEmail = function() {
            const assunto = encodeURIComponent("Análise de Documento - DocFlow IA");
            const corpo = encodeURIComponent("Segue o relatório da análise:\n\n" + iaResultado.innerText);
            window.location.href = `mailto:?subject=${assunto}&body=${corpo}`;
        }

        window.baixarTxt = function() {
            const blob = new Blob([iaResultado.innerText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'analise_documento.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
