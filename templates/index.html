<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow - IA de Classificação e Tratamento de Documentos</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8">
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                DocFlow IA
            </h1>
            <p class="text-slate-400 text-sm mt-2">
                Envie um documento (PDF, imagem ou texto) para classificação e extração automática de informações.
            </p>
        </div>

        <!-- Área de Upload -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-300 mb-2">Selecione o Documento</label>
            <input type="file" id="fileInput" 
                class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2 transition">
        </div>

        <!-- Botão de Envio -->
        <button onclick="processarDocumento()" id="btnProcessar"
            class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
            <span>Analisar Documento</span>
        </button>

        <!-- Área de Resultado -->
        <div class="mt-8">
            <h2 class="text-lg font-semibold text-slate-300 mb-3">Resultado da Análise</h2>
            <div id="resultado" class="w-full min-h-[150px] bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-slate-300 text-sm overflow-y-auto whitespace-pre-wrap">
                Aguardando o envio do documento...
            </div>
        </div>
    </div>

    <!-- Script de Integração -->
    <script>
        async function processarDocumento() {
            const fileInput = document.getElementById('fileInput');
            const resultadoDiv = document.getElementById('resultado');
            const btnProcessar = document.getElementById('btnProcessar');

            if (fileInput.files.length === 0) {
                alert("Por favor, selecione um arquivo primeiro.");
                return;
            }

            const formData = new FormData();
            // O nome da chave 'arquivo' precisa ser idêntico ao request.files['arquivo'] do Flask
            formData.append('arquivo', fileInput.files[0]);

            // Feedback visual de carregamento
            btnProcessar.disabled = true;
            btnProcessar.classList.add('opacity-50', 'cursor-not-allowed');
            resultadoDiv.innerHTML = "Analisando documento com Inteligência Artificial, por favor aguarde...";

            try {
                const response = await fetch('/api/analisar', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultadoDiv.innerHTML = data.resultado;
                } else {
                    resultadoDiv.innerHTML = `Erro: ${data.error || 'Erro desconhecido ao processar.'}`;
                }
            } catch (error) {
                resultadoDiv.innerHTML = `Erro de conexão com o servidor: ${error.message}`;
            } finally {
                // Restaura o botão
                btnProcessar.disabled = false;
                btnProcessar.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
