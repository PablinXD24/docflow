<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificador e Tratador de Documentos por IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-700">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                IA de Classificação de Documentos
            </h1>
            <p class="text-slate-400 mt-2">Envie um arquivo PDF, imagem ou documento para análise e tratamento automatizado.</p>
        </header>

        <main class="space-y-6">
            <!-- Área de Upload de Arquivo -->
            <div class="border-2 border-dashed border-slate-600 rounded-xl p-6 text-center hover:border-blue-500 transition cursor-pointer relative bg-slate-900/50">
                <input type="file" id="documento-arquivo" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="mostrarNomeArquivo(this)">
                <div id="upload-placeholder" class="space-y-2">
                    <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <p class="text-sm text-slate-300"><span class="font-semibold text-blue-400">Clique para enviar</span> ou arraste o arquivo aqui</p>
                    <p class="text-xs text-slate-500">PDF, PNG, JPG ou TXT</p>
                </div>
            </div>

            <button id="btn-analisar" onclick="processarDocumento()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                <span>Processar Documento</span>
            </button>

            <div id="loading" class="hidden text-center py-4 text-blue-400 font-medium animate-pulse">
                Lendo e processando o documento com Inteligência Artificial...
            </div>

            <div id="resultado-container" class="hidden mt-6 bg-slate-900 border border-slate-700 rounded-xl p-6">
                <h2 class="text-lg font-semibold text-blue-400 mb-3">Resultado da Análise</h2>
                <div id="resultado-conteudo" class="prose prose-invert max-w-none text-slate-300 whitespace-pre-wrap"></div>
            </div>
        </main>
    </div>

    <script>
        function mostrarNomeArquivo(input) {
            const placeholder = document.getElementById('upload-placeholder');
            if (input.files && input.files[0]) {
                placeholder.innerHTML = `<p class="text-sm font-medium text-emerald-400">Arquivo selecionado: ${input.files[0].name}</p>`;
            }
        }

        async function processarDocumento() {
            const fileInput = document.getElementById('documento-arquivo');
            const btn = document.getElementById('btn-analisar');
            const loading = document.getElementById('loading');
            const container = document.getElementById('resultado-container');
            const conteudo = document.getElementById('resultado-conteudo');

            if (fileInput.files.length === 0) {
                alert('Por favor, selecione um arquivo de documento primeiro.');
                return;
            }

            const formData = new FormData();
            formData.append('documento', fileInput.files[0]);

            btn.disabled = true;
            loading.classList.remove('hidden');
            container.classList.add('hidden');

            try {
                const response = await fetch('/api/analisar', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    conteudo.innerText = data.resultado;
                    container.classList.remove('hidden');
                } else {
                    alert('Erro: ' + (data.error || 'Erro desconhecido'));
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
