<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow IA - Análise e Gestão de Documentos</title>
    <style>
        /* ESTÉTICA LIQUID GLASS & BOLINHAS DE FUNDO */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; 
            overflow-x: hidden; position: relative;
        }

        /* CAMADA DE FUNDO COM BOLINHAS LIGADAS (APENAS ESTÉTICA) */
        #bgUniverse {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .lines-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .connection-line { fill: none; stroke: rgba(52, 152, 219, 0.3); stroke-width: 1.5px; stroke-linecap: round; }

        .bg-circle-wrapper { position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%); }
        .neon-circle { 
            width: 100%; height: 100%; border-radius: 50%; 
            background: rgba(52, 152, 219, 0.5); box-shadow: 0 0 12px rgba(52, 152, 219, 0.4); 
            animation: floatVertical 5s ease-in-out infinite;
        }
        @keyframes floatVertical { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        
        .main-wrapper { display: flex; gap: 20px; width: 100%; max-width: 800px; justify-content: center; align-items: flex-start; z-index: 10; }

        .smart-container { 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.9); 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.08); 
            width: 100%; 
            max-width: 740px; 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        /* Tela de Autenticação */
        .auth-screen { padding: 40px 30px; display: flex; flex-direction: column; gap: 20px; text-align: center; }
        .auth-title { font-size: 22px; font-weight: 700; color: #2c3e50; }
        .auth-subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
        .auth-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #dcdde1; background: white; font-size: 15px; outline: none; transition: 0.3s; }
        .auth-input:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        
        .btn-primary { width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: #000; }
        
        .btn-google { width: 100%; padding: 12px; background: white; color: #2c3e50; border: 1px solid #dcdde1; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f1f2f6; }
        
        .auth-switch { font-size: 13px; color: #7f8c8d; cursor: pointer; margin-top: 10px; }
        .auth-switch span { color: #3498db; font-weight: 600; }

        /* Área de App */
        .app-screen { display: none; flex-direction: column; width: 100%; }
        .user-header { padding: 16px 24px; background: rgba(255, 255, 255, 0.4); border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #596a7b; }
        .btn-logout { background: transparent; border: none; color: #e74c3c; font-weight: 600; cursor: pointer; }

        .prompt-area { 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            background: rgba(255, 255, 255, 0.3); 
        }

        .header-title { font-size: 14px; font-weight: 600; color: #596a7b; display: flex; justify-content: space-between; align-items: center; }
        .ai-badge { font-size: 12px; background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; letter-spacing: 1px; }

        /* Barra Dividida em Duas Partes */
        .split-bar { display: flex; gap: 12px; align-items: center; width: 100%; position: relative; }
        .split-section { flex: 1; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
        
        .upload-trigger { cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; }
        .file-name { font-size: 14px; color: #2c3e50; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .search-input { width: 100%; background: transparent; border: none; outline: none; font-size: 14px; color: #2c3e50; }
        
        /* Dropdown de Opções de Busca */
        .search-results-dropdown {
            position: absolute; top: 110%; right: 0; width: 50%; max-height: 220px; overflow-y: auto;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none; flex-direction: column; gap: 6px; padding: 10px; z-index: 100;
        }
        .search-result-item {
            padding: 8px 12px; background: rgba(240, 245, 250, 0.7); border-radius: 8px; cursor: pointer;
            font-size: 13px; color: #2c3e50; font-weight: 600; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .search-result-item:hover { background: #3498db; color: white; }

        .action-bar { display: flex; justify-content: flex-end; align-items: center; margin-top: 4px; }
        .status-text { font-size: 13px; color: #3498db; font-weight: 500; opacity: 0; display: flex; align-items: center; gap: 8px; margin-right: auto; }
        
        .btn-submit { background: #2c3e50; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover:not(:disabled) { transform: scale(1.1); background: #000; }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        .results-area { max-height: 0; opacity: 0; transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); background: rgba(255, 255, 255, 0.9); border-top: 1px solid rgba(0,0,0,0.05); overflow: hidden; display: flex; }
        .expanded .results-area { max-height: 1200px; opacity: 1; padding: 32px 24px; }

        .result-content-wrapper { flex: 1; min-width: 0; }
        .result-title { font-size: 12px; font-weight: 700; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .script-box { background: white; border: 1px solid #dcdde1; padding: 16px; border-radius: 12px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        
        /* Sidebar de Compartilhamento e Ações */
        .share-sidebar { display: flex; flex-direction: column; gap: 10px; margin-left: 16px; justify-content: flex-start; align-items: center; padding-top: 24px; }
        .share-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; position: relative; text-decoration: none; color: #2c3e50; }
        .share-btn:hover { transform: scale(1.1); background: #f1f2f6; }
        .share-btn svg { width: 18px; height: 18px; }
        
        .share-btn.whatsapp:hover { background: #25d366; color: white; }
        .share-btn.email:hover { background: #ea4335; color: white; }
        .share-btn.copy:hover { background: #3498db; color: white; }
        .share-btn.download:hover { background: #2c3e50; color: white; }
        .share-btn.save-box:hover { background: #f39c12; color: white; }

        .spinner { width: 16px; height: 16px; border: 2px solid #3498db; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body tabindex="0">

    <!-- UNIVERSO DE BOLINHAS ESTÉTICAS NO FUNDO -->
    <div id="bgUniverse">
        <svg class="lines-layer" id="bgLines">
            <defs id="bgGradDefs"></defs>
        </svg>
    </div>

    <div class="main-wrapper">
        <div class="smart-container" id="mainContainer">
            
            <!-- TELA DE LOGIN / CADASTRO -->
            <div id="authScreen" class="auth-screen">
                <h1 class="auth-title" id="authTitle">Bem-vindo ao DocFlow IA</h1>
                <p class="auth-subtitle" id="authSubtitle">Faça login para continuar</p>
                
                <input type="email" id="emailInput" class="auth-input" placeholder="Seu e-mail">
                <input type="password" id="passwordInput" class="auth-input" placeholder="Sua senha">
                
                <button id="authBtn" class="btn-primary" onclick="handleAuth()">Entrar</button>
                <button class="btn-google" onclick="loginGoogle()">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.31 7.24 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.99 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.69 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    Continuar com Google
                </button>
                
                <div class="auth-switch" onclick="toggleAuthMode()">
                    Não tem uma conta? <span id="switchText">Cadastre-se</span>
                </div>
                <div id="authError" style="color: #e74c3c; font-size: 13px;"></div>
            </div>

            <!-- TELA DO APLICATIVO -->
            <div id="appScreen" class="app-screen">
                <div class="user-header">
                    <span id="userEmailDisplay">Logado como: ...</span>
                    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
                </div>

                <div class="prompt-area">
                    <div class="header-title">
                        <span>Gerenciamento de Documentos Inteligente</span>
                        <span class="ai-badge">✦ DocFlow IA</span>
                    </div>
                    
                    <!-- BARRA DIVIDIDA EM DOIS -->
                    <div class="split-bar">
                        <!-- Lado Esquerdo: Anexar Novo Arquivo -->
                        <div class="split-section upload-trigger" onclick="document.getElementById('arquivoPdf').click()">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2c3e50" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                            </svg>
                            <span id="fileName" class="file-name" style="color: #7f8c8d;">Anexar novo doc...</span>
                            <input type="file" id="arquivoPdf" accept=".pdf,.doc,.docx,.txt,.png,.jpg" style="display: none;" onchange="atualizarNomeArquivo()" />
                        </div>

                        <!-- Lado Direito: Buscar nos Resumos Salvos (Nome, CPF, CNPJ, etc.) -->
                        <div class="split-section" style="position: relative;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7f8c8d" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por Nome, CPF, CNPJ..." oninput="filtrarHistoricoBusca(this.value)">
                            
                            <!-- Dropdown de opções correspondentes ao lado -->
                            <div id="searchResultsDropdown" class="search-results-dropdown"></div>
                        </div>
                    </div>
                    
                    <div class="action-bar">
                        <div class="status-text" id="statusText">
                            <div class="spinner"></div> Processando documento...
                        </div>
                        
                        <button id="btnSubmit" class="btn-submit" disabled onclick="processarDocumento()">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="results-area">
                    <div class="result-content-wrapper">
                        <div class="result-block">
                            <div class="result-title" id="resultadoTitulo">⚡ Relatório da Análise</div>
                            <div class="script-box">
                                <div id="iaResultado" style="white-space: pre-wrap; color: #2c3e50; font-size: 15px; line-height: 1.5;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar de Compartilhamento e Ações -->
                    <div class="share-sidebar">
                        <button class="share-btn save-box" onclick="salvarNasCaixas()" title="Enviar para as Caixas (Salvar)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        </button>
                        <button class="share-btn whatsapp" onclick="compartilharWhatsApp()" title="WhatsApp">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                        </button>
                        <button class="share-btn email" onclick="compartilharEmail()" title="E-mail">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </button>
                        <button class="share-btn copy" onclick="copiarTexto()" title="Copiar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                        <button class="share-btn download" onclick="baixarTxt()" title="Baixar TXT">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3lORq3nF7mbcQc-YZObZvBwMXtVWQ5y4",
            authDomain: "systemhyper1.firebaseapp.com",
            databaseURL: "https://systemhyper1-default-rtdb.firebaseio.com",
            projectId: "systemhyper1",
            storageBucket: "systemhyper1.firebasestorage.app",
            messagingSenderId: "65464629978",
            appId: "1:65464629978:web:2201ea8087f992310403e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let isRegistering = false;
        let globalHistorico = [];
        let ultimoResultadoAtual = "";
        let ultimoNomeArquivoAtual = "";

        window.toggleAuthMode = function() {
            isRegistering = !isRegistering;
            document.getElementById('authTitle').textContent = isRegistering ? "Criar Nova Conta" : "Bem-vindo ao DocFlow IA";
            document.getElementById('authSubtitle').textContent = isRegistering ? "Cadastre-se para começar" : "Faça login para continuar";
            document.getElementById('authBtn').textContent = isRegistering ? "Cadastrar" : "Entrar";
            document.getElementById('switchText').textContent = isRegistering ? "Fazer login" : "Cadastre-se";
        }

        window.handleAuth = async function() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            const errDiv = document.getElementById('authError');
            errDiv.textContent = "";

            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (error) {
                errDiv.textContent = error.message;
            }
        }

        window.loginGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                document.getElementById('authError').textContent = error.message;
            }
        }

        window.fazerLogout = function() {
            signOut(auth);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                document.getElementById('userEmailDisplay').textContent = `Logado como: ${user.email}`;

                const historicoRef = ref(db, `historico_analises/${user.uid}`);
                onValue(historicoRef, (snapshot) => {
                    globalHistorico = [];
                    const data = snapshot.val();
                    if (data) {
                        Object.keys(data).forEach(key => {
                            globalHistorico.push({ id: key, ...data[key] });
                        });
                        globalHistorico.reverse();
                    }
                    gerarFundoCosmosEstetico(globalHistorico.length);
                });

            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
            }
        });

        const inputArquivo = document.getElementById('arquivoPdf');
        const fileName = document.getElementById('fileName');
        const btnSubmit = document.getElementById('btnSubmit');
        const mainContainer = document.getElementById('mainContainer');
        const statusText = document.getElementById('statusText');
        const iaResultado = document.getElementById('iaResultado');
        const resultadoTitulo = document.getElementById('resultadoTitulo');

        window.atualizarNomeArquivo = function() {
            if (inputArquivo.files.length > 0) {
                fileName.textContent = inputArquivo.files[0].name;
                fileName.style.color = "#2c3e50";
                btnSubmit.disabled = false;
            } else {
                fileName.textContent = "Anexar novo doc...";
                fileName.style.color = "#7f8c8d";
                btnSubmit.disabled = true;
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !btnSubmit.disabled && inputArquivo.files.length > 0) {
                processarDocumento();
            }
        });

        window.processarDocumento = async function() {
            if (inputArquivo.files.length === 0) return;

            const file = inputArquivo.files[0];
            ultimoNomeArquivoAtual = file.name;
            const formData = new FormData();
            formData.append('file', file);

            btnSubmit.disabled = true;
            statusText.style.opacity = "1";
            mainContainer.classList.remove('expanded');

            try {
                const response = await fetch('/api/analisar', {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const textError = await response.text();
                    throw new Error(`Erro do Servidor (${response.status}): ${textError.slice(0, 100)}`);
                }

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido ao processar.');
                }

                ultimoResultadoAtual = data.resultado;
                resultadoTitulo.textContent = `⚡ Resultado: ${file.name}`;
                iaResultado.textContent = data.resultado;
                mainContainer.classList.add('expanded');

                inputArquivo.value = "";
                fileName.textContent = "Anexar novo doc...";
                fileName.style.color = "#7f8c8d";
                btnSubmit.disabled = true;

            } catch (error) {
                console.error(error);
                resultadoTitulo.textContent = "⚡ Erro na Análise";
                iaResultado.textContent = `Erro: ${error.message}`;
                mainContainer.classList.add('expanded');
            } finally {
                statusText.style.opacity = "0";
            }
        }

        window.salvarNasCaixas = function() {
            if (!ultimoResultadoAtual) {
                alert("Nenhum resultado gerado para salvar.");
                return;
            }
            const user = auth.currentUser;
            if (user) {
                push(ref(db, `historico_analises/${user.uid}`), {
                    nome_arquivo: ultimoNomeArquivoAtual || "Documento Analisado",
                    resultado: ultimoResultadoAtual,
                    timestamp: serverTimestamp()
                });
                alert("Documento salvo com sucesso!");
            }
        }

        // Gera o fundo estético de bolinhas e linhas conectadas por todo o viewport
        function gerarFundoCosmosEstetico(quantidadeDocs) {
            const universe = document.getElementById('bgUniverse');
            universe.querySelectorAll('.bg-circle-wrapper').forEach(el => el.remove());
            
            const linesLayer = document.getElementById('bgLines');
            while (linesLayer.querySelectorAll('line').length > 0) linesLayer.removeChild(linesLayer.lastChild);

            const totalBolinhas = Math.max(12, quantidadeDocs * 2);
            const w = window.innerWidth;
            const h = window.innerHeight;
            let coords = [];

            for (let i = 0; i < totalBolinhas; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('bg-circle-wrapper');

                const x = Math.random() * (w - 100) + 50;
                const y = Math.random() * (h - 100) + 50;
                wrapper.style.left = `${x}px`;
                wrapper.style.top = `${y}px`;

                const circle = document.createElement('div');
                circle.classList.add('neon-circle');
                wrapper.appendChild(circle);
                universe.appendChild(wrapper);

                coords.push({ x, y });
            }

            // Conecta as bolinhas com linhas estéticas no fundo
            for (let i = 0; i < coords.length; i++) {
                for (let j = i + 1; j < coords.length; j++) {
                    const dist = Math.hypot(coords[i].x - coords[j].x, coords[i].y - coords[j].y);
                    if (dist < 200) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', coords[i].x);
                        line.setAttribute('y1', coords[i].y);
                        line.setAttribute('x2', coords[j].x);
                        line.setAttribute('y2', coords[j].y);
                        line.classList.add('connection-line');
                        linesLayer.appendChild(line);
                    }
                }
            }
        }

        window.filtrarHistoricoBusca = function(termo) {
            const dropdown = document.getElementById('searchResultsDropdown');
            if (!termo || termo.trim() === "") {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }

            const termoLower = termo.toLowerCase();
            const filtrados = globalHistorico.filter(item => 
                item.nome_arquivo.toLowerCase().includes(termoLower) || 
                item.resultado.toLowerCase().includes(termoLower)
            );

            if (filtrados.length === 0) {
                dropdown.style.display = 'flex';
                dropdown.innerHTML = '<div style="padding: 8px; font-size:12px; color:#7f8c8d;">Nenhum documento encontrado.</div>';
                return;
            }

            let html = '';
            filtrados.forEach(item => {
                html += `
                    <div class="search-result-item" onclick='selecionarDocumentoBusca(${JSON.stringify(item.nome_arquivo).replace(/'/g, "&#39;")}, ${JSON.stringify(item.resultado).replace(/'/g, "&#39;")})'>
                        📄 ${item.nome_arquivo}
                    </div>
                `;
            });
            dropdown.innerHTML = html;
            dropdown.style.display = 'flex';
        }

        window.selecionarDocumentoBusca = function(nome, resultado) {
            abrirDocumentoSalvo(nome, resultado);
            document.getElementById('searchInput').value = nome;
            document.getElementById('searchResultsDropdown').style.display = 'none';
        }

        window.abrirDocumentoSalvo = function(nome, resultado) {
            ultimoNomeArquivoAtual = nome;
            ultimoResultadoAtual = resultado;
            resultadoTitulo.textContent = `⚡ Resultado (Salvo): ${nome}`;
            iaResultado.textContent = resultado;
            mainContainer.classList.add('expanded');
        }

        window.copiarTexto = function() {
            navigator.clipboard.writeText(iaResultado.innerText);
            alert("Resultado copiado para a área de transferência!");
        }

        window.compartilharWhatsApp = function() {
            const texto = encodeURIComponent("Relatório de Análise do Documento:\n\n" + iaResultado.innerText);
            window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
        }

        window.compartilharEmail = function() {
            const assunto = encodeURIComponent("Análise de Documento - DocFlow IA");
            const corpo = encodeURIComponent("Segue o relatório da análise:\n\n" + iaResultado.innerText);
            window.location.href = `mailto:?subject=${assunto}&body=${corpo}`;
        }

        window.baixarTxt = function() {
            const blob = new Blob([iaResultado.innerText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'analise_documento.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
