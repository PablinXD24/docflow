<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocFlow IA - Cosmos Neural</title>
    <style>
        /* --- BASE & ESTÉTICA LIQUID GLASS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            margin: 0; padding: 0;
            background-color: #eef1f5;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(55, 97, 122, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(41, 250, 16, 0.08) 0%, transparent 25%);
            height: 100vh; width: 100vw; overflow: hidden;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
            perspective: 1000px;
            overscroll-behavior: none;
        }

        #app-logo {
            position: fixed; top: 25px; left: 25px;
            width: 130px; height: auto; z-index: 500;
            pointer-events: none; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        /* --- TELA DE AUTENTICAÇÃO --- */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(220, 225, 235, 0.9);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 5000;
            display: flex; justify-content: center; align-items: center;
            opacity: 1; transition: opacity 0.4s ease;
        }
        #auth-overlay.hidden { display: none; opacity: 0; pointer-events: none; }

        .auth-card {
            width: 90vw; max-width: 380px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px; padding: 35px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .auth-title { font-size: 22px; font-weight: 800; color: #333; margin: 0 0 5px 0; }
        .auth-subtitle { font-size: 13px; color: #777; margin-bottom: 25px; }
        .auth-input {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #ddd;
            background: #fafafa; font-size: 14px; color: #333; outline: none; transition: 0.2s; margin-bottom: 12px;
        }
        .auth-input:focus { border-color: #29FA10; background: #fff; }
        .auth-btn {
            width: 100%; padding: 13px; border-radius: 12px; border: none;
            background: #37617A; color: #fff; font-weight: 700; font-size: 14px;
            cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(55, 97, 122, 0.2);
        }

        /* --- MUNDO INFINITO (NEURÔNIOS) --- */
        #viewport {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; cursor: grab; z-index: 0; touch-action: none;
        }
        #viewport:active { cursor: grabbing; }
        #world { position: absolute; top: 0; left: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
        .lines-layer { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; z-index: 1; }
        .connection-line { fill: none; stroke-width: 2.5px; stroke-linecap: round; opacity: 0.8; vector-effect: non-scaling-stroke; }
        
        .circle-wrapper { position: absolute; width: 36px; height: 36px; z-index: 10; transform: translate(-50%, -50%); cursor: pointer; }
        .neon-circle { width: 100%; height: 100%; border-radius: 50%; animation: floatVertical 4s ease-in-out infinite; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; box-shadow: 0 0 15px currentColor; }
        @keyframes floatVertical { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        
        .message-tooltip { 
            position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.8); color: #fff; padding: 6px 12px; border-radius: 12px; 
            font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 20;
        }
        .circle-wrapper:hover .message-tooltip { opacity: 1; }

        /* --- BARRA INFERIOR (UPLOAD & BUSCA INTELIGENTE) --- */
        .bottom-ui-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; align-items: center; gap: 12px;
            width: 90%; max-width: 700px;
        }
        
        .dock-bar {
            width: 100%; background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px; padding: 12px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 15px;
        }

        .split-side { flex: 1; display: flex; align-items: center; gap: 10px; }
        .split-divider { width: 1px; height: 30px; background: rgba(0,0,0,0.1); }
        
        .upload-btn-label {
            background: #37617A; color: white; padding: 8px 14px; border-radius: 12px;
            font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: 0.2s; white-space: nowrap;
        }
        .upload-btn-label:hover { background: #2c4f63; }
        
        .search-input-bar {
            width: 100%; border: none; background: transparent; font-size: 14px; color: #333; outline: none;
        }

        /* PAINEL DE RESULTADOS DE BUSCA (AO LADO) */
        .search-results-popup {
            position: fixed; bottom: 105px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 700px; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px); border-radius: 20px; padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; flex-direction: column; gap: 8px; z-index: 1100;
            max-height: 250px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.9);
        }
        .search-result-item {
            padding: 10px 14px; background: rgba(255,255,255,0.7); border-radius: 12px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
        }
        .search-result-item:hover { background: #fff; transform: scale(1.01); border-left: 4px solid #37617A; }

        /* MODAL DE LEITURA DO CONTRATO / DOCUMENTO */
        .doc-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(15px);
            z-index: 3000; display: none; justify-content: center; align-items: center;
        }
        .doc-card {
            width: 90%; max-width: 600px; max-height: 85vh; background: white;
            border-radius: 30px; padding: 30px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow: hidden;
        }
        .doc-content { flex: 1; overflow-y: auto; font-size: 14px; line-height: 1.6; color: #333; white-space: pre-wrap; background: #f8f9fa; padding: 15px; border-radius: 12px; }
        
        .action-icon-btn {
            background: #37617A; color: white; border: none; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .action-icon-btn:hover { transform: scale(1.1); }

        .toast { 
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 12px 25px; 
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 4000; 
            font-weight: 600; color: #333; transition: transform 0.3s; font-size: 13px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <img id="app-logo" src="https://raw.githubusercontent.com/PablinXD24/NEURON3/main/neuron%20logo%20branco.png" alt="Logo">

    <!-- TELA DE LOGIN -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 class="auth-title">DocFlow IA</h2>
            <p class="auth-subtitle">Entre para acessar seu cosmos de documentos</p>
            <input type="email" class="auth-input" id="authEmail" placeholder="E-mail">
            <input type="password" class="auth-input" id="authPassword" placeholder="Senha">
            <button class="auth-btn" onclick="handleAuthSubmit()">Entrar / Cadastrar</button>
        </div>
    </div>

    <!-- MUNDO INFINITO (NEURÔNIOS / CAIXAS FLUTUANTES) -->
    <div id="viewport">
        <div id="world">
            <svg class="lines-layer" id="solo-lines"><defs id="grad-defs-solo"></defs></svg>
        </div>
    </div>

    <!-- PAINEL DE RESULTADOS DA BUSCA RÁPIDA -->
    <div class="search-results-popup" id="searchResultsPopup">
        <div style="font-size: 11px; font-weight: bold; color: #7f8c8d; text-transform: uppercase;">Resultados Encontrados:</div>
        <div id="searchResultsList"></div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO DO DOCUMENTO -->
    <div class="doc-modal" id="docModal">
        <div class="doc-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="modalDocTitle" style="color: #37617A;">Documento</h3>
                <button onclick="closeDocModal()" style="border:none; background:none; font-size:22px; cursor:pointer;">×</button>
            </div>
            <div class="doc-content" id="modalDocContent"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="action-icon-btn" onclick="salvarNasCaixasAtual()" title="Salvar nas Caixas">💾</button>
                <button class="action-icon-btn" onclick="compartilharWhatsApp()" title="WhatsApp">💬</button>
                <button class="action-icon-btn" onclick="baixarTxt()" title="Baixar TXT">📥</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><span id="toastText">Ação Concluída</span></div>

    <!-- BARRA INFERIOR DIVIDIDA -->
    <div class="bottom-ui-container">
        <div class="dock-bar">
            <!-- Lado Esquerdo: Anexar & Enviar Doc -->
            <div class="split-side">
                <label class="upload-btn-label">
                    📁 Anexar Doc
                    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.png,.jpg" style="display:none;" onchange="processarDocumento()">
                </label>
                <span id="fileNameDisplay" style="font-size: 13px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Nenhum arquivo</span>
            </div>

            <div class="split-divider"></div>

            <!-- Lado Direito: Buscar por Nome, CPF, CNPJ -->
            <div class="split-side">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#777" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="search-input-bar" id="searchInput" placeholder="Buscar por Nome, CPF, CNPJ..." oninput="executarBuscaInteligente(this.value)">
            </div>
        </div>
    </div>

    <!-- SCRIPTS DE INTEGRAÇÃO FIREBASE E LÓGICA -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getDatabase, ref, set, onValue, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB3lORq3nF7mbcQc-YZObZvBwMXtVWQ5y4",
        authDomain: "systemhyper1.firebaseapp.com",
        databaseURL: "https://systemhyper1-default-rtdb.firebaseio.com",
        projectId: "systemhyper1",
        storageBucket: "systemhyper1.firebasestorage.app",
        messagingSenderId: "65464629978",
        appId: "1:65464629978:web:2201ea8087f992310403e3"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const auth = getAuth(app);

      let currentUserId = null;
      let globalDocumentos = [];
      let ultimoResultadoTexto = "";
      let ultimoNomeArquivo = "";

      onAuthStateChanged(auth, (user) => {
          if (user) {
              currentUserId = user.uid;
              document.getElementById('auth-overlay').classList.add('hidden');
              carregarDocumentosBanco();
          } else {
              document.getElementById('auth-overlay').classList.remove('hidden');
          }
      });

      window.handleAuthSubmit = async function() {
          const email = document.getElementById('authEmail').value;
          const pass = document.getElementById('authPassword').value;
          if(!email || !pass) { showToast("Preencha e-mail e senha."); return; }
          try {
              await signInWithEmailAndPassword(auth, email, pass);
          } catch(e) {
              try {
                  await createUserWithEmailAndPassword(auth, email, pass);
              } catch(err) {
                  showToast("Erro de autenticação: " + err.message);
              }
          }
      }

      window.salvarNasCaixasAtual = function() {
          if(!currentUserId || !ultimoResultadoTexto) {
              showToast("Nenhum documento processado para salvar.");
              return;
          }
          push(ref(db, `documentos_salvos/${currentUserId}`), {
              nome: ultimoNomeArquivo,
              conteudo: ultimoResultadoTexto,
              timestamp: serverTimestamp()
          });
          showToast("Documento salvo nas caixas neurais!");
          closeDocModal();
      }

      function carregarDocumentosBanco() {
          if(!currentUserId) return;
          onValue(ref(db, `documentos_salvos/${currentUserId}`), (snapshot) => {
              const data = snapshot.val();
              globalDocumentos = [];
              world.querySelectorAll('.circle-wrapper').forEach(el => el.remove());
              
              if(data) {
                  let index = 0;
                  Object.keys(data).forEach(key => {
                      const doc = data[key];
                      globalDocumentos.push({ id: key, ...doc });
                      
                      // Criar bolinha flutuante (neurônio) no cosmos
                      const angle = index * 1.2;
                      const radius = 100 + (index * 40);
                      const x = window.innerWidth / 2 + Math.cos(angle) * radius;
                      const y = window.innerHeight / 2 + Math.sin(angle) * radius;
                      
                      criarBolinhaNeural(x, y, doc.nome, doc.conteudo);
                      index++;
                  });
              }
          });
      }

      window.executarBuscaInteligente = function(termo) {
          const popup = document.getElementById('searchResultsPopup');
          const list = document.getElementById('searchResultsList');
          if(!termo || termo.trim().length === 0) {
              popup.style.display = 'none';
              return;
          }

          const termoLower = termo.toLowerCase();
          const encontrados = globalDocumentos.filter(d => 
              d.nome.toLowerCase().includes(termoLower) || 
              d.conteudo.toLowerCase().includes(termoLower)
          );

          if(encontrados.length === 0) {
              popup.style.display = 'none';
              return;
          }

          let html = '';
          encontrados.forEach(doc => {
              html += `
                <div class="search-result-item" onclick="abrirDocModal('${doc.nome.replace(/'/g, "")}', ${JSON.stringify(doc.conteudo).replace(/'/g, "&#39;")})">
                    <span>📄 <strong>${doc.nome}</strong></span>
                    <span style="font-size: 11px; color: #37617A;">Ver contrato ➔</span>
                </div>
              `;
          });
          list.innerHTML = html;
          popup.style.display = 'flex';
      }

      window.abrirDocModal = function(nome, conteudo) {
          ultimoNomeArquivo = nome;
          ultimoResultadoTexto = conteudo;
          document.getElementById('modalDocTitle').innerText = nome;
          document.getElementById('modalDocContent').innerText = conteudo;
          document.getElementById('docModal').style.display = 'flex';
          document.getElementById('searchResultsPopup').style.display = 'none';
      }

      window.closeDocModal = function() {
          document.getElementById('docModal').style.display = 'none';
      }

      window.processarDocumento = async function() {
          const fileInput = document.getElementById('fileInput');
          if(fileInput.files.length === 0) return;
          const file = fileInput.files[0];
          ultimoNomeArquivo = file.name;
          document.getElementById('fileNameDisplay').innerText = file.name;

          const formData = new FormData();
          formData.append('file', file);
          showToast("Processando documento com IA...");

          try {
              const response = await fetch('/api/analisar', { method: 'POST', body: formData });
              const data = await response.json();
              if(response.ok) {
                  ultimoResultadoTexto = data.resultado;
                  abrirDocModal(file.name, data.resultado);
                  fileInput.value = ""; // Limpa a barra para ficar livre
                  document.getElementById('fileNameDisplay').innerText = "Anexar novo doc...";
              } else {
                  showToast("Erro: " + (data.error || "Falha ao processar"));
              }
          } catch(e) {
              showToast("Erro de conexão ao analisar documento.");
          }
      }

      function criarBolinhaNeural(x, y, nome, conteudo) {
          const wrapper = document.createElement('div');
          wrapper.className = 'circle-wrapper';
          wrapper.style.left = `${x}px`;
          wrapper.style.top = `${y}px`;

          const circle = document.createElement('div');
          circle.className = 'neon-circle';
          circle.style.backgroundColor = '#37617A';
          circle.innerText = nome[0].toUpperCase();

          const tooltip = document.createElement('div');
          tooltip.className = 'message-tooltip';
          tooltip.innerText = nome;

          circle.appendChild(tooltip);
          wrapper.appendChild(circle);
          document.getElementById('world').appendChild(wrapper);

          wrapper.addEventListener('click', () => {
              abrirDocModal(nome, conteudo);
          });
      }

      window.showToast = function(msg) {
          const t = document.getElementById('toast');
          document.getElementById('toastText').innerText = msg;
          t.classList.add('show');
          setTimeout(() => t.classList.remove('show'), 3500);
      }

      window.copiarTexto = function() {
          navigator.clipboard.writeText(ultimoResultadoTexto);
          showToast("Texto copiado!");
      }
      window.compartilharWhatsApp = function() {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(ultimoResultadoTexto)}`, '_blank');
      }
      window.baixarTxt = function() {
          const blob = new Blob([ultimoResultadoTexto], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `${ultimoNomeArquivo}.txt`;
          a.click(); URL.revokeObjectURL(url);
      }
    </script>
</body>
</html>
