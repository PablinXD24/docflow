<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow - Análise de Documentos</title>
    <!-- Tailwind CSS (Aviso no console não impede o funcionamento) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Analisador de Documentos</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Selecione um arquivo PDF:</label>
            <input type="file" id="arquivoPdf" accept=".pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
        </div>

        <button onclick="processarDocumento()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-medium hover:bg-blue-700 transition">
            Analisar Documento
        </button>

        <div id="resultado" class="mt-4 p-4 bg-gray-100 rounded-md hidden text-sm text-gray-800 whitespace-pre-wrap"></div>
    </div>

    <script>
        async function processarDocumento() {
            const inputArquivo = document.getElementById('arquivoPdf');
            const resultadoDiv = document.getElementById('resultado');

            if (inputArquivo.files.length === 0) {
                alert('Por favor, selecione um arquivo PDF primeiro.');
                return;
            }

            const formData = new FormData();
            formData.append('file', inputArquivo.files[0]); // Certifique-se de que a chave bate com o backend ('file' ou 'arquivo')

            resultadoDiv.classList.remove('hidden');
            resultadoDiv.textContent = 'Processando documento...';

            try {
                const response = await fetch('https://docflow-6nws.onrender.com/api/analisar', {
                    method: 'POST',
                    // ⚠️ ATENÇÃO: NÃO inclua 'Content-Type': 'application/json' aqui. 
                    // O fetch com FormData exige que o navegador defina o boundary automaticamente.
                    body: formData
                });

                // Se o servidor retornar erro HTML (ex: 415, 500, 404), tratamos para não quebrar no .json()
                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const textError = await response.text();
                    throw new Error(`Erro do Servidor (${response.status}): ${textError.slice(0, 100)}...`);
                }

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido ao processar.');
                }

                resultadoDiv.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                console.error(error);
                resultadoDiv.textContent = `Erro: ${error.message}`;
            }
        }
    </script>
</body>
</html>
