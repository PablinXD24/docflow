<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow IA - Análise de Documentos</title>
    <style>
        /* ESTÉTICA LIQUID GLASS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        .smart-container { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.9); 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.08); 
            width: 100%; 
            max-width: 700px; 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        .prompt-area { padding: 24px; display: flex; flex-direction: column; gap: 16px; background: rgba(255, 255, 255, 0.3); }
        .header-title { font-size: 14px; font-weight: 600; color: #596a7b; display: flex; justify-content: space-between; align-items: center; }
        
        .ai-badge { 
            font-size: 12px; 
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 800; 
            letter-spacing: 1px;
        }

        .upload-row { display: flex; align-items: center; gap: 12px; }
        .file-label { 
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; 
            background: #2c3e50; color: white; border-radius: 12px; font-size: 14px; 
            font-weight: 600; cursor: pointer; transition: 0.3s; 
        }
        .file-label:hover { background: #000; }
        .file-name { font-size: 14px; color: #2c3e50; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .status-text { font-size: 13px; color: #3498db; font-weight: 500; opacity: 0; display: flex; align-items: center; gap: 8px; }
        
        .btn-submit { background: #2c3e50; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover:not(:disabled) { transform: scale(1.1); background: #000; }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        .results-area { max-height: 0; opacity: 0; transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); background: rgba(255, 255, 255, 0.85); border-top: 1px solid rgba(0,0,0,0.05); overflow: hidden; }
        .expanded .results-area { max-height: 1200px; opacity: 1; padding: 32px 24px; }

        .result-block { margin-bottom: 24px; }
        .result-title { font-size: 12px; font-weight: 700; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .script-box { background: white; border: 1px solid #dcdde1; padding: 16px; border-radius: 12px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        
        .btn-copy { position: absolute; top: 12px; right: 12px; background: #f1f2f6; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .btn-copy:hover { background: #e4e6ef; }

        .spinner { width: 16px; height: 16px; border: 2px solid #3498db; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="smart-container" id="mainContainer">
        <div class="prompt-area">
            <div class="header-title">
                <span>Análise e Classificação de Documentos</span>
                <span class="ai-badge">✦ DocFlow IA</span>
            </div>
            
            <div class="upload-row">
                <label class="file-label">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                    </svg>
                    Selecionar Arquivo
                    <input type="file" id="arquivoPdf" accept=".pdf,.doc,.docx,.txt,.png,.jpg" style="display: none;" onchange="atualizarNomeArquivo()" />
                </label>
                <span id="fileName" class="file-name">Nenhum arquivo selecionado</span>
            </div>
            
            <div class="action-bar">
                <div class="status-text" id="statusText">
                    <div class="spinner"></div> Processando documento...
                </div>
                
                <button id="btnSubmit" class="btn-submit" disabled onclick="processarDocumento()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="results-area">
            <div class="result-block">
                <div class="result-title" id="resultadoTitulo">⚡ Relatório da Análise</div>
                <div class="script-box">
                    <button id="btnCopiar" class="btn-copy">Copiar</button>
                    <div id="iaResultado" style="white-space: pre-wrap; color: #2c3e50; font-size: 15px; line-height: 1.5;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputArquivo = document.getElementById('arquivoPdf');
        const fileName = document.getElementById('fileName');
        const btnSubmit = document.getElementById('btnSubmit');
        const mainContainer = document.getElementById('mainContainer');
        const statusText = document.getElementById('statusText');
        const iaResultado = document.getElementById('iaResultado');
        const resultadoTitulo = document.getElementById('resultadoTitulo');

        function atualizarNomeArquivo() {
            if (inputArquivo.files.length > 0) {
                fileName.textContent = inputArquivo.files[0].name;
                btnSubmit.disabled = false;
            } else {
                fileName.textContent = "Nenhum arquivo selecionado";
                btnSubmit.disabled = true;
            }
        }

        async function processarDocumento() {
            if (inputArquivo.files.length === 0) return;

            const file = inputArquivo.files[0];
            const formData = new FormData();
            formData.append('file', file);

            btnSubmit.disabled = true;
            statusText.style.opacity = "1";
            mainContainer.classList.remove('expanded');

            try {
                const response = await fetch('/api/analisar', {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const textError = await response.text();
                    throw new Error(`Erro do Servidor (${response.status}): ${textError.slice(0, 100)}`);
                }

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido ao processar.');
                }

                resultadoTitulo.textContent = `⚡ Resultado: ${file.name}`;
                iaResultado.textContent = data.resultado;
                mainContainer.classList.add('expanded');

            } catch (error) {
                console.error(error);
                resultadoTitulo.textContent = "⚡ Erro na Análise";
                iaResultado.textContent = `Erro: ${error.message}`;
                mainContainer.classList.add('expanded');
            } finally {
                statusText.style.opacity = "0";
                btnSubmit.disabled = false;
            }
        }

        document.getElementById('btnCopiar').addEventListener('click', () => {
            navigator.clipboard.writeText(iaResultado.innerText);
            const b = document.getElementById('btnCopiar');
            b.innerText = "Copiado!";
            setTimeout(() => b.innerText = "Copiar", 2000);
        });
    </script>
</body>
</html>
