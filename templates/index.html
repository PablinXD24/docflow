<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch IA - Recomendações Inteligentes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #f8fafc;
        }

        .main-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }

        .smart-container { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); 
            width: 100%; 
            padding: 30px;
            display: flex; 
            flex-direction: column; 
            gap: 24px;
        }

        /* Header e Autenticação */
        .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .logo-area { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { font-size: 13px; color: #94a3b8; display: flex; gap: 15px; align-items: center; }
        .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-logout:hover { background: #ef4444; color: white; }

        /* Tela de Autenticação */
        .auth-box { max-width: 400px; margin: 80px auto; width: 100%; background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 16px; text-align: center; }
        .auth-input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; outline: none; }
        .auth-input:focus { border-color: #38bdf8; }
        .btn-primary { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-google { width: 100%; padding: 12px; background: white; color: #1e293b; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-switch { font-size: 13px; color: #94a3b8; cursor: pointer; }
        .auth-switch span { color: #38bdf8; font-weight: 600; }

        /* Seleção de Filmes */
        .section-title { font-size: 16px; font-weight: 700; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        
        .selected-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .slot { 
            height: 180px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 10px; position: relative; background: rgba(15, 23, 42, 0.4);
            overflow: hidden;
        }
        .slot.filled { border: 2px solid #38bdf8; border-style: solid; }
        .slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; border-radius: 10px; }
        .slot-remove { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; z-index: 5; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .slot-placeholder { font-size: 12px; color: #64748b; font-weight: 500; }

        /* Barra de Pesquisa de Filmes */
        .search-container { position: relative; width: 100%; }
        .search-input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; outline: none; }
        .search-input:focus { border-color: #38bdf8; }

        .search-dropdown {
            position: absolute; top: calc(100% + 5px); left: 0; right: 0; max-height: 300px; overflow-y: auto;
            background: #1e293b; border: 1px solid #475569; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none; flex-direction: column; gap: 6px; padding: 10px; z-index: 99;
        }
        .search-result-item {
            display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .search-result-item:hover { background: #334155; }
        .search-result-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }
        .search-item-info { display: flex; flex-direction: column; gap: 2px; }
        .search-item-title { font-size: 14px; font-weight: 600; color: #f8fafc; }
        .search-item-year { font-size: 11px; color: #94a3b8; }

        /* Botão Enviar para IA */
        .action-row { display: flex; justify-content: flex-end; margin-top: 10px; }
        .btn-generate { background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%); color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; opacity: 0.5; pointer-events: none; }
        .btn-generate.active { opacity: 1; pointer-events: auto; }
        .btn-generate:hover { transform: scale(1.02); }

        /* Área de Recomendações (Pôsteres) */
        .results-section { display: none; flex-direction: column; gap: 16px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; }
        .posters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        .movie-card { background: #0f172a; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; transition: 0.3s; }
        .movie-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; }
        .movie-card-content { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .movie-card-title { font-size: 13px; font-weight: 700; color: #f8fafc; }
        .movie-card-reason { font-size: 11px; color: #94a3b8; line-height: 1.4; }

        .spinner-container { display: none; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: #38bdf8; padding: 20px; }
        .spinner { width: 20px; height: 20px; border: 3px solid #38bdf8; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN / AUTENTICAÇÃO -->
    <div id="authScreen" class="auth-box">
        <h2 id="authTitle" style="color: #f8fafc;">CineMatch IA</h2>
        <p id="authSubtitle" style="font-size: 13px; color: #94a3b8;">Entre para descobrir recomendações</p>
        
        <input type="email" id="emailInput" class="auth-input" placeholder="Seu e-mail">
        <input type="password" id="passwordInput" class="auth-input" placeholder="Sua senha">
        
        <button id="authBtn" class="btn-primary" onclick="handleAuth()">Entrar</button>
        <button class="btn-google" onclick="loginGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.31 7.24 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.99 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.69 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            Entrar com Google
        </button>
        
        <div class="auth-switch" onclick="toggleAuthMode()">
            Não tem uma conta? <span id="switchText">Cadastre-se</span>
        </div>
        <div id="authError" style="color: #ef4444; font-size: 12px;"></div>
    </div>

    <!-- APLICATIVO PRINCIPAL -->
    <div id="appScreen" class="main-wrapper" style="display: none;">
        <div class="smart-container">
            <div class="app-header">
                <div class="logo-area">🎬 CineMatch IA</div>
                <div class="user-info">
                    <span id="userEmailDisplay">...</span>
                    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
                </div>
            </div>

            <!-- Seleção de Filmes -->
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="section-title">
                    <span>1. Selecione 3 Filmes Favoritos (<span id="countSelected">0</span>/3)</span>
                </div>
                
                <div class="selected-slots">
                    <div class="slot" id="slot0"><span class="slot-placeholder">Filme 1</span></div>
                    <div class="slot" id="slot1"><span class="slot-placeholder">Filme 2</span></div>
                    <div class="slot" id="slot2"><span class="slot-placeholder">Filme 3</span></div>
                </div>
            </div>

            <!-- Barra de Pesquisa Instantânea via TMDb direto no Front-end -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div class="section-title"><span>Buscar Filme na Biblioteca</span></div>
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Digite o nome de um filme (ex: Interestelar, Matrix...)" oninput="pesquisarFilmesTMDb(this.value)" autocomplete="off">
                    <div id="searchDropdown" class="search-dropdown"></div>
                </div>
            </div>

            <div class="action-row">
                <button id="btnGenerate" class="btn-generate" onclick="gerarRecomendacoes()">Gerar Recomendações com IA ✦</button>
            </div>

            <div id="spinnerContainer" class="spinner-container">
                <div class="spinner"></div> Analisando seus gostos e buscando os pôsteres recomendados...
            </div>

            <!-- Resultados de Recomendações em Pôsteres -->
            <div id="resultsSection" class="results-section">
                <div class="section-title"><span>✦ Filmes Recomendados para Você</span></div>
                <div id="postersGrid" class="posters-grid"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3lORq3nF7mbcQc-YZObZvBwMXtVWQ5y4",
            authDomain: "systemhyper1.firebaseapp.com",
            projectId: "systemhyper1",
            storageBucket: "systemhyper1.firebasestorage.app",
            messagingSenderId: "65464629978",
            appId: "1:65464629978:web:2201ea8087f992310403e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isRegistering = false;
        window.filmesSelecionados = [];

        // Constantes da API TMDb para uso direto no client-side
        const TMDB_API_KEY = "1f54bd990f1cdfb230adb312546d665d";
        const TMDB_IMAGE_BASE = "https://image.tmdb.org/t/p/w500";

        window.toggleAuthMode = function() {
            isRegistering = !isRegistering;
            document.getElementById('authTitle').textContent = isRegistering ? "Criar Conta" : "CineMatch IA";
            document.getElementById('authSubtitle').textContent = isRegistering ? "Cadastre-se para começar" : "Entre para descobrir recomendações";
            document.getElementById('authBtn').textContent = isRegistering ? "Cadastrar" : "Entrar";
            document.getElementById('switchText').textContent = isRegistering ? "Fazer login" : "Cadastre-se";
        }

        window.handleAuth = async function() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            const errDiv = document.getElementById('authError');
            errDiv.textContent = "";
            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (error) {
                errDiv.textContent = error.message;
            }
        }

        window.loginGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                document.getElementById('authError').textContent = error.message;
            }
        }

        window.fazerLogout = function() {
            signOut(auth);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                document.getElementById('userEmailDisplay').textContent = user.email;
                carregarFilmesIniciaisTMDb();
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
            }
        });

        // Pesquisa e Biblioteca de Filmes Integradas Diretamente no Index
        let timeoutId = null;
        window.pesquisarFilmesTMDb = function(termo) {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(async () => {
                const dropdown = document.getElementById('searchDropdown');
                let url = '';
                if (!termo || termo.trim() === '') {
                    url = `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_API_KEY}&language=pt-BR&page=1`;
                } else {
                    url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(termo)}&page=1`;
                }

                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        let html = '';
                        data.results.forEach(item => {
                            const poster_path = item.poster_path;
                            const poster_url = poster_path ? `${TMDB_IMAGE_BASE}${poster_path}` : 'https://via.placeholder.com/500x750?text=Sem+Poster';
                            const filmeObj = {
                                id: item.id,
                                title: item.title,
                                release_date: (item.release_date || '').substring(0, 4),
                                poster_url: poster_url
                            };

                            html += `
                                <div class="search-result-item" onclick='adicionarFilme(${JSON.stringify(filmeObj)})'>
                                    <img src="${filmeObj.poster_url}" alt="${filmeObj.title}">
                                    <div class="search-item-info">
                                        <span class="search-item-title">${filmeObj.title}</span>
                                        <span class="search-item-year">${filmeObj.release_date || 'N/A'}</span>
                                    </div>
                                </div>
                            `;
                        });
                        dropdown.innerHTML = html;
                        dropdown.style.display = 'flex';
                    } else {
                        dropdown.innerHTML = `<div style="padding: 10px; font-size:12px; color:#94a3b8; text-align:center;">Nenhum filme encontrado.</div>`;
                        dropdown.style.display = 'flex';
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 250);
        }

        async function carregarFilmesIniciaisTMDb() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_API_KEY}&language=pt-BR&page=1`);
                const data = await res.json();
                if (data.results) {
                    let html = '';
                    data.results.slice(0, 8).forEach(item => {
                        const poster_path = item.poster_path;
                        const poster_url = poster_path ? `${TMDB_IMAGE_BASE}${poster_path}` : 'https://via.placeholder.com/500x750?text=Sem+Poster';
                        const filmeObj = {
                            id: item.id,
                            title: item.title,
                            release_date: (item.release_date || '').substring(0, 4),
                            poster_url: poster_url
                        };

                        html += `
                            <div class="search-result-item" onclick='adicionarFilme(${JSON.stringify(filmeObj)})'>
                                <img src="${filmeObj.poster_url}" alt="${filmeObj.title}">
                                <div class="search-item-info">
                                    <span class="search-item-title">${filmeObj.title}</span>
                                    <span class="search-item-year">${filmeObj.release_date || 'N/A'}</span>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('searchDropdown').innerHTML = html;
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.adicionarFilme = function(filme) {
            if (window.filmesSelecionados.length >= 3) {
                alert("Você já selecionou 3 filmes. Remova um para escolher outro.");
                return;
            }
            if (window.filmesSelecionados.some(f => f.id === filme.id)) {
                alert("Este filme já foi selecionado.");
                return;
            }
            
            window.filmesSelecionados.push(filme);
            atualizarSlots();
            document.getElementById('searchInput').value = '';
            document.getElementById('searchDropdown').style.display = 'none';
        }

        window.removerFilme = function(index) {
            window.filmesSelecionados.splice(index, 1);
            atualizarSlots();
        }

        function atualizarSlots() {
            document.getElementById('countSelected').textContent = window.filmesSelecionados.length;
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot${i}`);
                if (window.filmesSelecionados[i]) {
                    const f = window.filmesSelecionados[i];
                    slot.className = "slot filled";
                    slot.innerHTML = `
                        <img src="${f.poster_url}" alt="${f.title}">
                        <button class="slot-remove" onclick="removerFilme(${i})">✕</button>
                    `;
                } else {
                    slot.className = "slot";
                    slot.innerHTML = `<span class="slot-placeholder">Filme ${i+1}</span>`;
                }
            }

            const btnGen = document.getElementById('btnGenerate');
            if (window.filmesSelecionados.length === 3) {
                btnGen.classList.add('active');
            } else {
                btnGen.classList.remove('active');
            }
        }

        window.gerarRecomendações = async function() {
            if (window.filmesSelecionados.length < 3) return;

            const spinner = document.getElementById('spinnerContainer');
            const resultsSection = document.getElementById('resultsSection');
            const postersGrid = document.getElementById('postersGrid');

            spinner.style.display = 'flex';
            resultsSection.style.display = 'none';
            postersGrid.innerHTML = '';

            try {
                // 1. Pede recomendação textual para o Flask/Gemini
                const response = await fetch('/api/recomendar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filmes: window.filmesSelecionados })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao gerar recomendações');

                let html = '';
                // 2. Para cada recomendação da IA, buscamos o pôster oficial diretamente no TMDb via JavaScript
                for (let rec of data.recomendacoes) {
                    let posterUrl = 'https://via.placeholder.com/500x750?text=Poster+Indisponivel';
                    try {
                        const tmdbRes = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(rec.titulo)}`);
                        const tmdbData = await tmdbRes.json();
                        if (tmdbData.results && tmdbData.results.length > 0 && tmdbData.results[0].poster_path) {
                            posterUrl = `${TMDB_IMAGE_BASE}${tmdbData.results[0].poster_path}`;
                        }
                    } catch (err) {
                        console.error("Erro ao buscar pôster:", err);
                    }

                    html += `
                        <div class="movie-card">
                            <img src="${posterUrl}" alt="${rec.titulo}">
                            <div class="movie-card-content">
                                <div class="movie-card-title">${rec.titulo}</div>
                                <div class="movie-card-reason">${rec.motivo}</div>
                            </div>
                        </div>
                    `;
                }

                postersGrid.innerHTML = html;
                resultsSection.style.display = 'flex';
            } catch (e) {
                alert(e.message);
            } finally {
                spinner.style.display = 'none';
            }
        }

        // Fechar dropdown ao clicar fora
        document.addEventListener('click', function(e) {
            const container = document.querySelector('.search-container');
            if (!container.contains(e.target)) {
                document.getElementById('searchDropdown').style.display = 'none';
            }
        });

        document.getElementById('searchInput').addEventListener('focus', function() {
            if (this.value.trim() === '') {
                carregarFilmesIniciaisTMDb();
            }
            document.getElementById('searchDropdown').style.display = 'flex';
        });
    </script>
</body>
</html>
