<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Teste de IA - Hugging Face</title>
    <!-- Tailwind CSS para estilização rápida e bonita -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-amber-500">
            IA no Navegador 🚀
        </h1>
        <p class="text-xs text-slate-400 text-center mb-6">
            Rodando modelos do Hugging Face localmente (Sem limites de API!)
        </p>

        <!-- Campo de Texto -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-300 mb-2">Digite uma frase (em inglês funciona melhor para este modelo padrão):</label>
            <textarea id="userInput" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 transition" placeholder="Ex: I love building web apps with AI!"></textarea>
        </div>

        <!-- Botão de Ação -->
        <button id="analyzeBtn" onclick="runAI()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-3 rounded-xl transition shadow-lg cursor-pointer">
            Analisar Sentimento
        </button>

        <!-- Área de Resultado -->
        <div id="resultContainer" class="mt-6 hidden">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Resultado da IA:</h2>
            <div id="outputBox" class="bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm text-amber-400 font-mono">
                Processando...
            </div>
        </div>
    </div>

    <!-- Importação do Transformers.js via CDN -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

        let classifier = null;

        async function initAI() {
            const outputBox = document.getElementById('outputBox');
            const btn = document.getElementById('analyzeBtn');
            
            outputBox.parentElement.classList.remove('hidden');
            outputBox.innerText = "Baixando/Carregando modelo de IA no navegador (primeira vez pode demorar alguns segundos)...";
            btn.disabled = true;

            try {
                // Carrega o pipeline de análise de sentimento diretamente no browser
                classifier = await pipeline('sentiment-analysis');
                outputBox.innerText = "Modelo pronto! Pode digitar e testar.";
                btn.disabled = false;
            } catch (error) {
                outputBox.innerText = "Erro ao carregar o modelo: " + error.message;
            }
        }

        // Inicializa a IA assim que a página abre
        initAI();

        // Tornando a função global para o HTML enxergar
        window.runAI = async function() {
            const text = document.getElementById('userInput').value;
            const outputBox = document.getElementById('outputBox');
            
            if (!text.trim()) {
                alert("Digite algum texto primeiro!");
                return;
            }

            if (!classifier) {
                alert("O modelo ainda está carregando, aguarde um instante.");
                return;
            }

            outputBox.innerText = "Analisando...";
            
            try {
                const result = await classifier(text);
                // Exibe o rótulo (ex: POSITIVE / NEGATIVE) e a pontuação de confiança
                outputBox.innerHTML = `<strong>Rótulo:</strong> ${result[0].label} <br><strong>Confiança:</strong> ${(result[0].score * 100).toFixed(2)}%`;
            } catch (err) {
                outputBox.innerText = "Erro na execução: " + err.message;
            }
        }
    </script>
</body>
</html>
